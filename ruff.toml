# Lint the backend, bench and scripts. Rules: pyflakes (real bugs, unused code), pycodestyle errors, bugbear.
line-length = 200
target-version = "py310"
extend-exclude = ["frontend", "graph", "mock_helpdesk"]

[lint]
select = ["E", "F", "B", "W"]
ignore = [
  "E501",  # long lines are formatted by hand here
  "E701", "E702",
  "B008",  # FastAPI Depends() in defaults is the idiom
  "B904",
  "W291", "W293",
]

[lint.per-file-ignores]
"backend/app/main.py" = ["E402"]
"backend/tests/*" = ["E402", "E741"]
"tests/*" = ["E402", "E741", "B023", "B007", "F841"]  # stress harnesses: closures run inside the loop that defines them
"bench/*" = ["E402", "B023", "B007", "F841", "E741"]
"scripts/*" = ["E402", "B023", "B007", "F841", "E741"]
"mcp/*" = ["E402"]
"backend/app/services/context_pack.py" = ["E741"]
"**/__init__.py" = ["F401"]
"backend/app/services/workspace.py" = ["E741"]
"backend/app/services/mcp_tools.py" = ["E741"]
