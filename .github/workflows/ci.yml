name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify

  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt ruff mypy hypothesis pytest-timeout
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    env:
      # required by compose on purpose (no insecure defaults); throwaway values are enough to validate and build
      FALKORDB_PASSWORD: ci-only
      QUORUM_TOKENS_JSON: '{}'
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose --env-file .env.production.example -f docker-compose.yml -f docker-compose.production.yml config -q
      - name: Images build
        run: docker compose build
